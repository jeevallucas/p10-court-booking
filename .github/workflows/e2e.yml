name: End-to-end and load

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgres://court:court@localhost:5432/court_booking?sslmode=disable
  DEMO_OWNER_PASSWORD: arena-demo-2026

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: court
          POSTGRES_PASSWORD: court
          POSTGRES_DB: court_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court -d court_booking"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Seed the demo venue
        working-directory: api
        run: go run ./cmd/seed
      - name: Compile the API before Playwright starts it
        working-directory: api
        run: go build ./cmd/api
      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - name: Run the end-to-end tests
        working-directory: web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: court
          POSTGRES_PASSWORD: court
          POSTGRES_DB: court_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U court -d court_booking"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Seed the demo venue
        working-directory: api
        run: go run ./cmd/seed
      - name: Start the API
        working-directory: api
        # One trusted proxy hop lets each virtual player bring its own address (load/hold-race.js).
        run: |
          go build -o bin/api ./cmd/api
          TRUSTED_PROXY_HOPS=1 PAYMENT_SERVER_KEY=load-test-key COOKIE_SECURE=false \
            nohup ./bin/api > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz > /dev/null && exit 0
            sleep 1
          done
          cat api.log
          exit 1
      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.4.0
      - name: Two hundred players race for one court hour
        run: k6 run load/hold-race.js
