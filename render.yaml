# The demo API on Render's free plan, created from this file as a Render Blueprint.
# The database is on Neon and the web app on Vercel; see docs/decisions.md for why.
services:
  - type: web
    name: p10-court-booking-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Neon's connection string; pasted into Render when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: PAYMENT_SERVER_KEY
        generateValue: true
      - key: PUBLIC_WEB_URL
        value: https://p10-court-booking.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      # Requests arrive through Vercel's rewrite and Render's proxy (docs/decisions.md).
      - key: TRUSTED_PROXY_HOPS
        value: "1"
